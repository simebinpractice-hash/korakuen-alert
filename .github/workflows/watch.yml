name: korakuen-watch

on:
  schedule:
    # 10분마다 (정각은 GitHub 부하로 지연이 잦아서 7분 단위로 어긋나게)
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "현재 상태를 테스트 알림으로 보내기"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: korakuen-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check rooms
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TEST_NOTIFY: ${{ inputs.test }}
        run: python3 watch.py

      - name: Save state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "state: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
